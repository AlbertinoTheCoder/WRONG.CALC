<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">WRONG.CALC — Small sums. Big mistakes.</title>
  <desc id="desc">A purple calculator display confidently claims that nine plus nine equals fish.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171329"/><stop offset="1" stop-color="#0d1019"/></linearGradient>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#29283e"/><stop offset="1" stop-color="#181b29"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#8660db" stop-opacity=".2"/><stop offset="1" stop-color="#8660db" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="440" rx="20" fill="url(#bg)"/>
  <ellipse cx="1050" cy="220" rx="430" ry="350" fill="url(#light)"/>
  <path d="M64 58h28" stroke="#b79aff" stroke-width="4"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="106" y="63" fill="#aaa3bc" font-size="12" letter-spacing="2">CALCULATIONS. COMPLICATIONS.</text>
    <text x="60" y="164" fill="#faf9ff" font-size="76" font-weight="800" letter-spacing="-4">WRONG<tspan fill="#b79aff">.CALC</tspan></text>
    <text x="64" y="221" fill="#f4f1fc" font-size="30" font-weight="700" letter-spacing="-.7">Small sums. Big mistakes.</text>
    <text x="65" y="260" fill="#aba8bd" font-size="18">A browser calculator with an ego problem.</text>
    <path d="M65 311h540" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="65" y="347" fill="#b79aff" font-size="13" font-weight="700" letter-spacing="1.2">0% ACCURACY</text>
    <text x="244" y="347" fill="#aaa8bc" font-size="13" letter-spacing="1.2">100% CONFIDENCE</text>
    <text x="65" y="402" fill="#777488" font-size="11" letter-spacing="1.2">POWERED BY ABSOLUTELY NOTHING.</text>
    <rect x="747" y="54" width="467" height="332" rx="25" fill="#080a12" opacity=".4"/>
    <rect x="735" y="42" width="467" height="332" rx="25" fill="url(#panel)" stroke="#56506c"/>
    <circle cx="765" cy="77" r="4" fill="#74dfb4"/>
    <text x="779" y="81" fill="#c5c2d5" font-size="10" letter-spacing="1">CONFIDENTLY INCORRECT</text>
    <text x="1172" y="81" text-anchor="end" fill="#89839e" font-size="10">IQ: 3</text>
    <rect x="755" y="101" width="427" height="188" rx="14" fill="#0d0f1b" stroke="#413b56"/>
    <text x="775" y="130" fill="#87839f" font-size="10" letter-spacing="1.2">INACCURACY ENGINE</text>
    <text x="1160" y="166" text-anchor="end" fill="#b6aecb" font-size="18">9 + 9 =</text>
    <text x="1161" y="235" text-anchor="end" fill="#faf9ff" font-size="70" font-weight="800" letter-spacing="-3">FISH</text>
    <path d="M776 253h385" stroke="#2d2c40"/>
    <text x="777" y="275" fill="#b79aff" font-size="12">:)  the answer is fish. case closed.</text>
    <rect x="755" y="305" width="94" height="48" rx="9" fill="#303044" stroke="#474259"/>
    <rect x="860" y="305" width="94" height="48" rx="9" fill="#303044" stroke="#474259"/>
    <rect x="965" y="305" width="94" height="48" rx="9" fill="#303044" stroke="#474259"/>
    <rect x="1070" y="305" width="112" height="48" rx="9" fill="#b79aff"/>
    <g font-size="22" text-anchor="middle" fill="#eeeaf8"><text x="802" y="337">7</text><text x="907" y="337">8</text><text x="1012" y="337">9</text><text x="1126" y="337" fill="#201832">=</text></g>
  </g>
</svg>
